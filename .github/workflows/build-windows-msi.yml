name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    paths:
      - 'ATRAC_UI_v31_38_UNIFIED.pyw'
      - 'installer.wxs'
      - 'ATRAC_Converter_icon.py'
      - '.github/workflows/build-windows-msi.yml'

permissions:
  contents: read

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter tkinterdnd2 pillow mutagen ytmusicapi certifi yt-dlp

      - name: Install FFmpeg and prepare app icon
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          python ATRAC_Converter_icon.py
          if (!(Test-Path 'ATRAC_v30.ico')) { throw 'Icon generation failed' }
          $ffmpeg = (Get-Command ffmpeg.exe -ErrorAction Stop).Source
          $ffprobe = (Get-Command ffprobe.exe -ErrorAction Stop).Source
          & $ffmpeg -version
          & $ffprobe -version

      - name: Build Windows application
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build,dist -ErrorAction SilentlyContinue
          $icon = (Resolve-Path 'ATRAC_v30.ico').Path
          pyinstaller --clean --noconfirm --windowed --name ATRAC_Converter --icon "$icon" --add-data "ATRAC_v30.ico;." --collect-all customtkinter --collect-all tkinterdnd2 --collect-all certifi --collect-all yt_dlp --collect-all mutagen --collect-all ytmusicapi --hidden-import PIL._tkinter_finder ATRAC_UI_v31_38_UNIFIED.pyw
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          $ffmpeg = (Get-Command ffmpeg.exe -ErrorAction Stop).Source
          $ffprobe = (Get-Command ffprobe.exe -ErrorAction Stop).Source
          Copy-Item $ffmpeg 'dist\\ATRAC_Converter\\ffmpeg.exe' -Force
          Copy-Item $ffprobe 'dist\\ATRAC_Converter\\ffprobe.exe' -Force
          if (!(Test-Path 'dist\\ATRAC_Converter\\ffmpeg.exe')) { throw 'Bundled ffmpeg missing' }
          if (!(Test-Path 'dist\\ATRAC_Converter\\ffprobe.exe')) { throw 'Bundled ffprobe missing' }
          if (!(Test-Path 'dist\ATRAC_Converter\ATRAC_Converter.exe')) { throw 'ATRAC_Converter.exe was not created.' }

      - name: Install WiX Toolset 3.14
        shell: pwsh
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if (!$wix) { choco install wixtoolset -y --no-progress }
          $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (!$wix) { throw 'WiX Toolset was not found.' }
          "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Harvest application files
        shell: pwsh
        run: |
          heat dir 'dist\ATRAC_Converter' -cg AppFiles -dr INSTALLFOLDER -gg -srd -sfrag -sreg -var var.SourceDir -out harvested.wxs
          # Per-user MSI requires HKCU registry KeyPaths for components in LocalAppDataFolder.
          [xml]$doc = Get-Content 'harvested.wxs' -Raw
          $ns = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
          $ns.AddNamespace('w', 'http://schemas.microsoft.com/wix/2006/wi')
          $components = $doc.SelectNodes('//w:Component', $ns)
          foreach ($component in $components) {
            foreach ($node in $component.SelectNodes('./w:File', $ns)) {
              if ($node.HasAttribute('KeyPath')) { $node.RemoveAttribute('KeyPath') }
            }
            $reg = $doc.CreateElement('RegistryValue', 'http://schemas.microsoft.com/wix/2006/wi')
            $reg.SetAttribute('Root', 'HKCU')
            $reg.SetAttribute('Key', 'Software\ATRAC\ATRAC Audio Video Converter\Components')
            $reg.SetAttribute('Name', $component.GetAttribute('Id'))
            $reg.SetAttribute('Type', 'integer')
            $reg.SetAttribute('Value', '1')
            $reg.SetAttribute('KeyPath', 'yes')
            [void]$component.AppendChild($reg)
          }
          # ICE64: explicitly remove every harvested user-profile directory on uninstall.
          $dirs = $doc.SelectNodes('//w:Directory', $ns)
          foreach ($dir in $dirs) {
            $dirId = $dir.GetAttribute('Id')
            $target = $dir.SelectSingleNode('.//w:Component', $ns)
            if (!$target -or !$dirId) { continue }
            $remove = $doc.CreateElement('RemoveFolder', 'http://schemas.microsoft.com/wix/2006/wi')
            $remove.SetAttribute('Id', 'Rm' + $dirId)
            $remove.SetAttribute('Directory', $dirId)
            $remove.SetAttribute('On', 'uninstall')
            [void]$target.AppendChild($remove)
          }
          $doc.Save((Join-Path (Get-Location) 'harvested.wxs'))


      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_output | Out-Null
          $src = (Resolve-Path 'dist\ATRAC_Converter').Path
          candle -arch x64 -dSourceDir="$src" installer.wxs harvested.wxs
          light -ext WixUIExtension -cultures:ja-jp -o installer_output\ATRAC_Converter_ja-JP.msi installer.wixobj harvested.wixobj
          # Build English edition with Windows Installer product language 1033.
          (Get-Content installer.wxs -Raw).Replace('Language="1041"', 'Language="1033"').Replace('installer-license-ja.rtf', 'installer-license-en.rtf') | Set-Content -Path installer-en.wxs -Encoding utf8
          candle -arch x64 -dSourceDir="$src" installer-en.wxs
          light -ext WixUIExtension -cultures:en-us -o installer_output\ATRAC_Converter_en-US.msi installer-en.wixobj harvested.wixobj
          if (!(Test-Path 'installer_output\ATRAC_Converter_ja-JP.msi')) { throw 'Japanese MSI was not created.' }
          if (!(Test-Path 'installer_output\ATRAC_Converter_en-US.msi')) { throw 'English MSI was not created.' }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATRAC-Audio-Video-Converter-Windows-MSI
          path: installer_output/*.msi
          if-no-files-found: error
