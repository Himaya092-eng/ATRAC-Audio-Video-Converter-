name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter tkinterdnd2 ytmusicapi certifi pillow

      - name: Verify application source
        shell: bash
        run: |
          test -f ATRAC_UI_v31_38_UNIFIED.pyw
          test -f ATRAC_Converter_mac.spec
          echo "Application source and macOS spec found."

      - name: Build macOS app with PyInstaller
        shell: bash
        run: |
          pyinstaller --clean --noconfirm ATRAC_Converter_mac.spec

      - name: Locate app bundle
        shell: bash
        run: |
          find dist -maxdepth 3 -name '*.app' -print
          APP=$(find dist -maxdepth 3 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "PyInstaller did not create a macOS .app bundle."
            find dist -maxdepth 3 -print
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Create DMG
        shell: bash
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R "$APP" "dmg-root/"
          ln -s /Applications "dmg-root/Applications"
          hdiutil create \
            -volname "ATRAC Audio Converter" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "ATRAC_Audio_Converter.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATRAC-Audio-Converter-macOS-DMG
          path: ATRAC_Audio_Converter.dmg
          if-no-files-found: error
