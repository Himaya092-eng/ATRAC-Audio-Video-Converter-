name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller

      - name: Find application entry point
        shell: bash
        run: |
          echo "Repository files:"
          find . -maxdepth 2 -type f | sort
          ENTRY=$(find . -maxdepth 2 -type f \( -name 'main.py' -o -name 'app.py' -o -name 'main_*.py' \) | head -n 1)
          if [ -z "$ENTRY" ]; then
            echo "No Python application entry point found. Upload the application source files first."
            exit 1
          fi
          echo "ENTRY=$ENTRY" >> "$GITHUB_ENV"

      - name: Build macOS app
        shell: bash
        run: |
          pyinstaller --windowed --name "ATRAC Audio Converter" "$ENTRY"

      - name: Create DMG
        shell: bash
        run: |
          mkdir -p dmg-root
          cp -R "dist/ATRAC Audio Converter.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "ATRAC Audio Converter" -srcfolder dmg-root -ov -format UDZO "ATRAC Audio Converter.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATRAC-Audio-Converter-macOS-DMG
          path: "ATRAC Audio Converter.dmg"
          if-no-files-found: error
