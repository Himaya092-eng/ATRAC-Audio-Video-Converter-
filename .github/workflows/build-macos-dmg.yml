name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter tkinterdnd2 ytmusicapi certifi pillow

      - name: Verify application source
        shell: bash
        run: |
          test -f ATRAC_UI_v31_38_UNIFIED.pyw
          test -f ATRAC_Converter_mac.spec
          echo "Application source and macOS spec found."

      - name: Build macOS app with PyInstaller
        shell: bash
        run: |
          pyinstaller --clean --noconfirm ATRAC_Converter_mac.spec

      - name: Create macOS .app bundle
        shell: bash
        run: |
          set -e
          APP="dist/ATRAC Audio Converter.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp -R dist/ATRAC_Converter/. "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>ATRAC Audio Converter</string>
            <key>CFBundleExecutable</key>
            <string>ATRAC_Converter</string>
            <key>CFBundleIdentifier</key>
            <string>com.wadahiromi.atracaudioconverter</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>ATRAC Audio Converter</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          chmod +x "$APP/Contents/MacOS/ATRAC_Converter"
          echo "APP=$APP" >> "$GITHUB_ENV"
          test -x "$APP/Contents/MacOS/ATRAC_Converter"
          test -f "$APP/Contents/Info.plist"
          echo "Created $APP"

      - name: Create DMG
        shell: bash
        run: |
          set -e
          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R "$APP" "dmg-root/"
          ln -s /Applications "dmg-root/Applications"
          hdiutil create \
            -volname "ATRAC Audio Converter" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "ATRAC_Audio_Converter.dmg"
          test -f "ATRAC_Audio_Converter.dmg"
          ls -lh "ATRAC_Audio_Converter.dmg"

      - name: Create bilingual PKG installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pkg-resources/ja.lproj pkg-resources/en.lproj
          cat > pkg-resources/ja.lproj/License.txt <<'EOF'
          ATRAC Audio Converter 利用規約（草案）
          このソフトは音声・動画変換およびタグ編集のために提供されます。
          利用権限を持つファイルにのみ使用し、第三者の権利を尊重してください。
          変換前に大切なファイルをバックアップしてください。
          本ソフトは現状有姿で提供されます。法律上排除できない権利は制限しません。
          正式公開前に配布者がこの規約を確認してください。
          EOF
          cat > pkg-resources/en.lproj/License.txt <<'EOF'
          ATRAC Audio Converter Terms of Use (Draft)
          This software is provided for audio/video conversion and metadata editing.
          Use it only with files you have permission to process. Respect third-party rights.
          Back up important files before converting.
          This software is provided as is. Rights that cannot legally be excluded are unaffected.
          The distributor must review these terms before public release.
          EOF
          mkdir -p pkg-root/Applications
          cp -R "$APP" pkg-root/Applications/
          pkgbuild --root pkg-root --identifier com.wadahiromi.atracaudioconverter --version 1.0 --install-location / ATRAC_Component.pkg
          productbuild --synthesize --package ATRAC_Component.pkg distribution.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path("distribution.xml")
          s=p.read_text()
          s=s.replace("<installer-gui-script", "<installer-gui-script", 1)
          s=s.replace("</installer-gui-script>", '  <license file="License.txt"/>\n</installer-gui-script>')
          p.write_text(s)
          PY
          productbuild --distribution distribution.xml --resources pkg-resources --package-path . ATRAC_Audio_Converter_Installer.pkg
          test -s ATRAC_Audio_Converter_Installer.pkg

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATRAC-Audio-Converter-macOS-PKG
          path: ATRAC_Audio_Converter_Installer.pkg
          if-no-files-found: error

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATRAC-Audio-Converter-macOS-DMG
          path: ATRAC_Audio_Converter.dmg
          if-no-files-found: error
